name: Atualizar CDI Diário

on:
  schedule:
    # Roda de segunda a sexta-feira às 22:00 UTC (19:00 Horário de Brasília)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Ativa o botão para rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão obrigatória para salvar o arquivo

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Executar script de cálculo
      run: python atualizar_cdi.py

    - name: Salvar e publicar alterações
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add cdi_acumulado.json
        git diff-index --quiet HEAD || (git commit -m "Atualização automática do CDI" && git push)
